<!doctype html>
<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Inside Human VR : voyage immersif à l'intérieur du corps humain." />
	<title>Inside Human VR</title>
	<link rel="icon" href="data:," />
	<link rel="stylesheet" href="./styles.css" />
</head>
<body>
	<!-- Canvas 3D (ajouté par le moteur) -->
	<div id="app"></div>

	<!-- Écran d'accueil provisoire (l'écran final est la tâche de Melek) -->
	<main id="home">
		<h1>Inside Human VR</h1>
		<p class="subtitle">Voyage immersif à l'intérieur du corps humain</p>
		<p class="help">
			VR : visez un disque bleu avec la manette et appuyez sur la gâchette pour vous téléporter.<br />
			Bureau : la souris oriente le regard, clic pour se téléporter ou sélectionner, touches 1 à 3 pour les points, Échap pour quitter.
		</p>
		<div class="buttons">
			<button id="btn-vr" type="button" disabled>Entrer en VR</button>
			<button id="btn-desktop" type="button">Mode bureau</button>
		</div>
		<p id="status" role="status"></p>
	</main>

	<!-- Réticule du mode bureau -->
	<div id="reticle" hidden></div>

	<script type="module" src="./src/main.js"></script>
</body>
</html>
