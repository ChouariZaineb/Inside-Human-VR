# ci-cd.yml — Intégration et déploiement continus d'Inside Human VR (un seul workflow)
#
# @author Chouari Zaineb
# @role   CI/CD : à chaque push et à chaque pull request, vérifier automatiquement que le projet
#         s'installe, que les tests unitaires passent et qu'il se construit, puis lancer les tests
#         de bout en bout (WebGPU, VR simulée Meta Quest 3, interactions, PWA hors ligne).
#         Sur main uniquement, publier ensuite le site sur GitHub Pages.
#
# Trois jobs enchaînés :   build  →  e2e  →  deploy
#   => le site n'est mis en ligne QUE si tous les tests (unitaires ET VR) passent.
#
# Adresse publique : https://chouarizaineb.github.io/Inside-Human-VR/
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# Résultat visible sur GitHub : onglet « Actions », et coche verte / croix rouge sur chaque pull request.

name: CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

# Droits par défaut : lecture du code seulement (le job deploy demande en plus l'écriture sur Pages).
permissions:
  contents: read

# Un nouveau push sur la même branche annule le passage précédent, devenu inutile
# (sauf sur main, pour ne jamais interrompre une publication en cours).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 1. Installation, tests unitaires et construction de la version de production.
  build:
    name: Build et tests unitaires
    runs-on: ubuntu-26.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 26.13.1 LTS (« Lithium »)
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Installer les dépendances (versions exactes du package-lock.json)
        run: npm ci

      - name: Tests unitaires (progression, score, déblocage, tableau de bord)
        run: npm test

      - name: Construire la version de production (dossier dist/)
        run: npm run build

  # 2. Tests de bout en bout dans un vrai Chromium, avec un casque Meta Quest 3 simulé (iwer).
  e2e:
    name: Tests de bout en bout (Playwright + VR simulée)
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 26.13.1 LTS (« Lithium »)
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests de bout en bout
        # Sous Linux, WebGPU passe par SwiftShader (rendu logiciel) : voir playwright.config.mjs.
        run: npm run test:e2e
        env:
          HEADLESS: '1'

      - name: Publier le rapport des tests (captures et traces en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 14

  # 3. Publication sur GitHub Pages : seulement sur main, et seulement si build ET e2e ont réussi.
  deploy:
    name: Publier en ligne (GitHub Pages)
    needs: [ build, e2e ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    # Droits nécessaires pour publier sur GitHub Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Un seul déploiement à la fois ; un déploiement en cours n'est jamais interrompu.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js 26.13.1 LTS (« Lithium »)
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire la version de production (dossier dist/)
        run: npm run build

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le dossier dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
