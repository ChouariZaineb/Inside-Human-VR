<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corps réaliste – squelette et organes</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif}
  body{background:radial-gradient(circle at 50% 40%,#2a2a2e,#0b0b0d)}
  canvas{position:fixed;inset:0}
  .bar{position:fixed;top:14px;left:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap}
  button{border:0;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer;background:rgba(255,255,255,.85);color:#222}
  button.on{background:#4aa3ff;color:#fff}
  #hud{position:fixed;bottom:6px;left:10px;font-size:12px;color:#aaa}
  #err{position:fixed;left:10px;right:10px;top:60px;z-index:99;background:rgba(150,10,10,.92);color:#fff;font:13px/1.45 ui-monospace,Consolas,monospace;padding:10px 14px;border-radius:6px;white-space:pre-wrap;max-height:55vh;overflow:auto;display:none}
</style></head>
<body>
<div id="err"></div>
<script>
  (function () {
    var box = document.getElementById('err'), lines = [], ready = false;
    function show(t) { lines.push(String(t).slice(0, 700)); box.style.display = 'block'; box.textContent = lines.slice(-6).join('\n\n'); }
    window.addEventListener('error', function (e) { show('ERREUR: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) { show('PROMESSE REJETÉE: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
    window.__ready = function () { ready = true; };
    setTimeout(function () { if (!ready) show("Scène non initialisée après 15 s. WebGPU est obligatoire : vérifiez chrome://gpu."); }, 15000);
  })();
</script>
<div class="bar">
  <button data-v="assembled">Dans le corps</button><button data-v="exploded">Vue éclatée</button>
  <button data-f="lungs">Poumons</button><button data-f="brain">Cerveau</button><button data-f="heart">Cœur</button><button data-f="">Tout</button>
</div>
<div id="hud"></div>
<!-- Three.js r187 est chargé par CDN ; cet import map permet aux addons distants d'importer "three". -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./body.mjs"></script>
</body></html>
